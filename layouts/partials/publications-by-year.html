{{ $pubs := . }}
{{ $years := slice }}
{{ range $pubs }}
  {{ $years = $years | append .year }}
{{ end }}
{{ range $years | uniq }}
  {{ $year := . }}
  <section class="year-group" data-filter-group>
    <p class="year-label">{{ $year }}</p>
    {{ range where $pubs "year" $year }}
      {{ partial "publication.html" . }}
    {{ end }}
  </section>
{{ end }}
